<g class="terminal">
<text x="75" y="110" textLength="9" fill="#dcdfe4">A</text>
<text x="93" y="110" textLength="108" class="b" fill="#dcdfe4">DocumentView</text>
<text x="210" y="110" textLength="63" fill="#dcdfe4">shows a</text>
<text x="282" y="110" textLength="216" fill="#e5c07b">Term::Fabulous::Document</text>
<text x="498" y="110" textLength="99" fill="#dcdfe4">: a list of</text>
<text x="606" y="110" textLength="45" fill="#101216">block</text>
<text x="651" y="110" textLength="54" fill="#dcdfe4">s that</text>
<text x="75" y="128" textLength="567" fill="#dcdfe4">a parser made of some source, POD or Markdown or anything else.</text>
<text x="57" y="164" textLength="54" class="b" fill="#ebeef3">Blocks</text>
<text x="75" y="200" textLength="612" fill="#dcdfe4">Every block has a kind, and the view shows each kind in the style of</text>
<text x="75" y="218" textLength="90" fill="#dcdfe4">the theme:</text>
<text x="79.5" y="254" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="254" textLength="504" fill="#dcdfe4">headings, in six levels, the first with a rule under it;</text>
<text x="79.5" y="272" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="272" textLength="603" fill="#dcdfe4">paragraphs, wrapped to the width of the view, with bold, italic and</text>
<text x="93" y="290" textLength="99" fill="#dcdfe4">code marks;</text>
<text x="79.5" y="308" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="308" textLength="540" fill="#dcdfe4">items of bulleted and numbered lists, with a hanging indent;</text>
<text x="79.5" y="326" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="326" textLength="432" fill="#dcdfe4">verbatim blocks, shown as code that never wraps;</text>
<text x="79.5" y="344" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="344" textLength="315" fill="#dcdfe4">and quotes, with a bar beside them.</text>
<text x="93" y="380" textLength="351" fill="#dcdfe4">A quoted block looks like this, and may</text>
<text x="453" y="380" textLength="54" class="i" fill="#dcdfe4">itself</text>
<text x="516" y="380" textLength="99" fill="#dcdfe4">hold marks.</text>
<text x="57" y="416" textLength="36" class="b" fill="#ebeef3">Code</text>
<text x="75" y="452" textLength="621" fill="#dcdfe4">The code blocks scroll sideways together with Left and Right, or with</text>
<text x="75" y="470" textLength="171" fill="#dcdfe4">a horizontal wheel:</text>
<text x="84" y="506" textLength="477" fill="#dcdfe4">my $view = Term::Fabulous::Widget::DocumentView-&gt;new(</text>
<text x="120" y="524" textLength="207" fill="#dcdfe4">id       =&gt; &quot;document&quot;,</text>
<text x="120" y="542" textLength="504" fill="#dcdfe4">document =&gt; $document,    # from a parser of your format</text>
<text x="84" y="560" textLength="18" fill="#dcdfe4">);</text>
<text x="57" y="596" textLength="45" class="b" fill="#ebeef3">Links</text>
<text x="75" y="632" textLength="126" fill="#dcdfe4">A link such as</text>
<text x="210" y="632" textLength="234" fill="#101216">Term::Fabulous on MetaCPAN</text>
<text x="453" y="632" textLength="252" fill="#dcdfe4">is selected with l and L and</text>
<text x="75" y="650" textLength="414" fill="#dcdfe4">followed with Enter or a click; the view fires</text>
<text x="498" y="650" textLength="108" fill="#e5c07b">LinkActivate</text>
<text x="615" y="650" textLength="90" fill="#dcdfe4">and leaves</text>
<text x="75" y="668" textLength="252" fill="#dcdfe4">the rest to the program. The</text>
<text x="336" y="668" textLength="54" fill="#61afef">Blocks</text>
<text x="399" y="668" textLength="252" fill="#dcdfe4">section above is a link too.</text>
<text x="39" y="704" textLength="693" fill="#96a0b4">DOCUMENT VIEW    1%  |  Enter follows https://metacpan.org/pod/Term::Fabulous</text>
</g>
