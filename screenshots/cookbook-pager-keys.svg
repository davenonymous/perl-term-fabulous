<text x="111" y="74" textLength="630" fill="#c8d2e6">return $self-&gt;_code_block($1) if $line                        =~ /\A``</text>
<text x="111" y="92" textLength="630" fill="#c8d2e6">return $self-&gt;_close if $line                                 =~ /\A\s</text>
<text x="111" y="110" textLength="630" fill="#c8d2e6">return $self-&gt;_heading( length $1, $2 ) if $line              =~ /\A(#</text>
<text x="111" y="128" textLength="630" fill="#c8d2e6">return $self-&gt;_quote( length( $1 =~ s/\s//gr ), $2 ) if $line =~ /\A((</text>
<text x="111" y="146" textLength="621" fill="#c8d2e6">return $self-&gt;_item( length $1, $2, $3 ) if $line             =~ /\A(</text>
<text x="111" y="164" textLength="360" fill="#c8d2e6">return $self-&gt;_continue($line) if $open;</text>
<text x="111" y="182" textLength="288" fill="#c8d2e6">return $self-&gt;_paragraph($line);</text>
<text x="75" y="200" textLength="9" fill="#c8d2e6">}</text>
<text x="43.5" y="218" text-anchor="middle" fill="#c8d2e6"> </text>
<text x="75" y="236" textLength="585" fill="#c8d2e6"># The open paragraph or item becomes a block, its text split into</text>
<text x="75" y="254" textLength="207" fill="#c8d2e6"># plain text and marks.</text>
<text x="75" y="272" textLength="162" fill="#c8d2e6">method _close () {</text>
<text x="111" y="290" textLength="180" fill="#c8d2e6">return unless $open;</text>
<text x="111" y="308" textLength="621" fill="#c8d2e6">push @blocks, $open-&gt;{class}-&gt;new( %{ $open-&gt;{parameters} }, _inline(</text>
<text x="111" y="326" textLength="126" fill="#c8d2e6">$open = undef;</text>
<text x="111" y="344" textLength="63" fill="#c8d2e6">return;</text>
<text x="75" y="362" textLength="9" fill="#c8d2e6">}</text>
<text x="43.5" y="380" text-anchor="middle" fill="#c8d2e6"> </text>
<text x="75" y="398" textLength="288" fill="#e5c07b">method _code_block ($language) {</text>
<text x="39" y="416" textLength="144" fill="#96a0b4">MiniMark.pm  43%</text>
