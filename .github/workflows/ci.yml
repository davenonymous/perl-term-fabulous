name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        perl:
          - '5.44.0'
          - '5.42.3'
          - '5.40.5'
          - '5.38.5'
          - '5.36.3'
          - '5.34.3'
          - '5.32.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show Perl configuration
        run: perl -V

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: make test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -vb t

  # termbox2 drives the Windows console through the backend in
  # src/patches; Strawberry Perl brings the gcc and gmake it is built
  # with. Tests that need a pty, fontconfig or signals skip there.
  test-windows:
    name: Perl ${{ matrix.perl }} on windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.40'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Strawberry Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: strawberry

      - name: Show Perl configuration
        run: perl -V

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: gmake

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: gmake test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -vb t

  # CPAN Testers also run perls built with other floating-point formats,
  # and the 80-bit x87 long double (-Duselongdouble) has caught rounding
  # bugs that plain doubles hide. actions-setup-perl ships no such perl,
  # so this job builds one from source, once per version and format, and
  # caches it.
  test-nv:
    name: Perl ${{ matrix.perl }} with ${{ matrix.nv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.44.0'
        nv:
          - longdouble
          - quadmath

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the built Perl
        id: perl
        uses: actions/cache@v4
        with:
          path: ~/perl-${{ matrix.nv }}
          key: perl-${{ matrix.perl }}-${{ matrix.nv }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Perl ${{ matrix.perl }} with -Duse${{ matrix.nv }}
        if: steps.perl.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://www.cpan.org/src/5.0/perl-${{ matrix.perl }}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/perl-${{ matrix.perl }}"
          ./Configure -des -Dprefix="$HOME/perl-${{ matrix.nv }}" -Duse${{ matrix.nv }}
          make -j"$(nproc)"
          make install
          curl -sSL https://cpanmin.us | "$HOME/perl-${{ matrix.nv }}/bin/perl" - --notest App::cpanminus

      - name: Put the built Perl first in PATH
        run: echo "$HOME/perl-${{ matrix.nv }}/bin" >> "$GITHUB_PATH"

      - name: Show Perl configuration
        run: perl -V

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: make test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -vb t

  release-checks:
    name: Distribution check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: latest

      - name: Install declared dependencies
        run: cpanm --installdeps --with-develop --notest .

      - name: Configure and build
        run: |
          perl Makefile.PL
          make

      - name: Module versions agree
        run: make version-check

      # make docs-check would also re-take the screenshots in a pty;
      # only check that the Markdown pages match the pod
      - name: Markdown pages are up to date
        run: perl tools/pod2markdown --check

      - name: Distribution builds and passes its tests
        run: make disttest
