name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # Clay::UI (with Clay::XS) is not on CPAN yet; install it from GitHub
  CLAY_UI_TARBALL: https://github.com/davenonymous/perl-clay-xs/archive/refs/heads/master.tar.gz

jobs:
  # termbox2 and I18N::Langinfo need a POSIX system, so there is no
  # Windows job
  test:
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        perl:
          - '5.44.0'
          - '5.42.3'
          - '5.40.5'
          - '5.38.5'
          - '5.36.3'
          - '5.34.3'
          - '5.32.1'
          - '5.30.3'
          - '5.28.3'
          - '5.26.3'
          - '5.24.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show Perl configuration
        run: perl -V

      - name: Install Clay::UI from GitHub
        run: cpanm --notest --verbose "$CLAY_UI_TARBALL"

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: make test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -vb t

  release-checks:
    name: Distribution check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: latest

      - name: Install Clay::UI from GitHub
        run: cpanm --notest "$CLAY_UI_TARBALL"

      - name: Install declared dependencies
        run: cpanm --installdeps --with-develop --notest .

      - name: Configure and build
        run: |
          perl Makefile.PL
          make

      - name: Module versions agree
        run: make version-check

      # make docs-check would also re-take the screenshots in a pty;
      # only check that the Markdown pages match the pod
      - name: Markdown pages are up to date
        run: perl tools/pod2markdown --check

      - name: Distribution builds and passes its tests
        run: make disttest
